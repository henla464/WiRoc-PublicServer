<!doctype html>
<html lang="en">
  <head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="libs/bootstrap-5.3.3-dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="ui/css/wiroc.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@eonasdan/tempus-dominus@6.9.11/dist/css/tempus-dominus.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Analyze Logs - WiRoc Monitor</title>
  </head>
  <body>
    <div id="nav-placeholder"></div>
    <div class="container-fluid">
      <h1>Analyze Logs</h1>
      <div
        id="loginRequiredAlert"
        class="alert alert-warning collapse"
        role="alert"
      >
        <strong>Please log in to use the log analyzer.</strong>
      </div>

      <div id="analyzerSection" style="display: none">
        <div class="row mb-3">
          <div class="col-md-4">
            <div class="card">
              <div class="card-header">
                <strong>Sender WiRoc Device</strong>
              </div>
              <div class="card-body">
                <div class="mb-2">
                  <label for="senderDeviceSelect" class="form-label">Device</label>
                  <select id="senderDeviceSelect" class="form-select analyze-selector">
                    <option value="">-- Select a sender device --</option>
                  </select>
                </div>
                <div class="mb-2">
                  <label for="senderZipSelect" class="form-label">Zip File</label>
                  <select id="senderZipSelect" class="form-select analyze-selector" disabled>
                    <option value="">-- First select a device --</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card">
              <div class="card-header">
                <strong>Repeater WiRoc Device</strong>
                <small class="text-muted">(optional)</small>
              </div>
              <div class="card-body">
                <div class="mb-2">
                  <label for="repeaterDeviceSelect" class="form-label">Device</label>
                  <select id="repeaterDeviceSelect" class="form-select analyze-selector">
                    <option value="">-- Optional: select repeater --</option>
                  </select>
                </div>
                <div class="mb-2">
                  <label for="repeaterZipSelect" class="form-label">Zip File</label>
                  <select id="repeaterZipSelect" class="form-select analyze-selector" disabled>
                    <option value="">-- First select a device --</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card">
              <div class="card-header">
                <strong>Receiver WiRoc Device</strong>
                <small class="text-muted">(optional)</small>
              </div>
              <div class="card-body">
                <div class="mb-2">
                  <label for="receiverDeviceSelect" class="form-label">Device</label>
                  <select id="receiverDeviceSelect" class="form-select analyze-selector">
                    <option value="">-- Optional: select receiver --</option>
                  </select>
                </div>
                <div class="mb-2">
                  <label for="receiverZipSelect" class="form-label">Zip File</label>
                  <select id="receiverZipSelect" class="form-select analyze-selector" disabled>
                    <option value="">-- First select a device --</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row mb-2 align-items-end">
          <div class="col-auto">
            <label class="form-label small mb-1">From</label>
            <div class="input-group input-group-sm" id="pickerFrom" data-td-target-input="nearest" data-td-target-toggle="nearest">
              <input id="filterFrom" type="text" class="form-control" data-td-target="#pickerFrom" style="width:170px" placeholder="yyyy-MM-dd HH:mm" autocomplete="off">
              <span class="input-group-text" data-td-target="#pickerFrom" data-td-toggle="datetimepicker" style="cursor:pointer"><i class="fa fa-calendar"></i></span>
            </div>
          </div>
          <div class="col-auto">
            <label class="form-label small mb-1">To</label>
            <div class="input-group input-group-sm" id="pickerTo" data-td-target-input="nearest" data-td-target-toggle="nearest">
              <input id="filterTo" type="text" class="form-control" data-td-target="#pickerTo" style="width:170px" placeholder="yyyy-MM-dd HH:mm" autocomplete="off">
              <span class="input-group-text" data-td-target="#pickerTo" data-td-toggle="datetimepicker" style="cursor:pointer"><i class="fa fa-calendar"></i></span>
            </div>
          </div>
          <div class="col-auto align-self-end">
            <div class="mb-1 small text-muted">Sender Message Types to include</div>
            <div class="d-flex align-items-end">
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="chkMT_SI" checked>
                <label class="form-check-label small" for="chkMT_SI">SI</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="chkMT_SRR" checked>
                <label class="form-check-label small" for="chkMT_SRR">SRR</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="chkMT_LORA">
                <label class="form-check-label small" for="chkMT_LORA">LORA</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="chkMT_REPEATER">
                <label class="form-check-label small" for="chkMT_REPEATER">REPEATER</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="chkShowStatus">
                <label class="form-check-label small" for="chkShowStatus">STATUS</label>
              </div>
            </div>
          </div>
          <div class="col-auto align-self-end">
            <button type="button" id="btnAnalyze" class="btn btn-primary" disabled>
              <span id="btnAnalyzeSpinner" class="spinner-border spinner-border-sm" style="display:none" role="status" aria-hidden="true"></span>
              Analyze
            </button>
          </div>
        </div>

        <div
          id="analyzeError"
          class="alert alert-danger collapse"
          role="alert"
        ></div>
        <div id="analyzeLoading" class="text-muted">
          Analyzing... this may take a moment for large files.
        </div>

        <div id="resultsSection" style="display: none">
          <div
            id="topScrollBar"
            style="overflow-x: auto; overflow-y: hidden; display: none"
          >
            <div style="height: 1px"></div>
          </div>
          <div class="table-responsive" id="tableScrollWrapper">
            <div id="analyzeTableContainer"></div>
          </div>
          <div id="summarySection" style="display: none; margin-top: 20px">
            <h5>Message Summary</h5>
            <div id="summaryContainer"></div>
          </div>
        </div>

        <!-- Sender Log Viewer -->
        <div id="senderLogSection" style="margin-top: 20px">
          <h5>Sender Logs</h5>
          <div class="row mb-2 align-items-end">
            <div class="col-auto">
              <select id="senderLogFileSelect" class="form-select form-select-sm" style="width:280px">
                <option value="">-- Click Load Logs --</option>
              </select>
            </div>
            <div class="col-auto">
              <button type="button" id="btnLoadSenderLogs" class="btn btn-outline-secondary btn-sm">Load logs</button>
            </div>
            <div class="col-auto">
              <button type="button" id="btnClearSenderLogs" class="btn btn-outline-secondary btn-sm">Clear</button>
            </div>
          </div>
          <div id="senderLogTableContainer"></div>
        </div>

        <!-- Repeater Log Viewer -->
        <div id="repeaterLogSection" style="margin-top: 20px">
          <h5>Repeater Logs</h5>
          <div class="row mb-2 align-items-end">
            <div class="col-auto">
              <select id="repeaterLogFileSelect" class="form-select form-select-sm" style="width:280px">
                <option value="">-- Click Load Logs --</option>
              </select>
            </div>
            <div class="col-auto">
              <button type="button" id="btnLoadRepeaterLogs" class="btn btn-outline-secondary btn-sm">Load logs</button>
            </div>
            <div class="col-auto">
              <button type="button" id="btnClearRepeaterLogs" class="btn btn-outline-secondary btn-sm">Clear</button>
            </div>
          </div>
          <div id="repeaterLogTableContainer"></div>
        </div>

        <!-- Receiver Log Viewer -->
        <div id="receiverLogSection" style="margin-top: 20px">
          <h5>Receiver Logs</h5>
          <div class="row mb-2 align-items-end">
            <div class="col-auto">
              <select id="receiverLogFileSelect" class="form-select form-select-sm" style="width:280px">
                <option value="">-- Click Load Logs --</option>
              </select>
            </div>
            <div class="col-auto">
              <button type="button" id="btnLoadReceiverLogs" class="btn btn-outline-secondary btn-sm">Load logs</button>
            </div>
            <div class="col-auto">
              <button type="button" id="btnClearReceiverLogs" class="btn btn-outline-secondary btn-sm">Clear</button>
            </div>
          </div>
          <div id="receiverLogTableContainer"></div>
        </div>

      </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@eonasdan/tempus-dominus@6.9.11/dist/js/tempus-dominus.min.js"></script>
    <script src="libs/TableFilter/TableFilter.js"></script>
    <script src="libs/TableSorter/js/jquery.tablesorter.min.js"></script>
    <script src="libs/TableSorter/js/jquery.tablesorter.widgets.min.js"></script>
    <script src="navinit.js"></script>

    <script>
      var senderZipFiles = [];
      var receiverZipFiles = [];
      var hasReceiverData = false;
      var hasRepeaterData = false;
      var tdFrom = null,
        tdTo = null;

      // localStorage helpers
      var ls = {
        get: function (k) {
          try {
            return localStorage.getItem("analyze_" + k);
          } catch (e) {
            return null;
          }
        },
        set: function (k, v) {
          try {
            localStorage.setItem("analyze_" + k, v);
          } catch (e) {}
        },
        getSel: function () {
          return {
            senderDevice: ls.get("senderDevice") || "",
            senderZip: ls.get("senderZip") || "",
            receiverDevice: ls.get("receiverDevice") || "",
            receiverZip: ls.get("receiverZip") || "",
            filterFrom: ls.get("filterFrom") || "",
            filterTo: ls.get("filterTo") || "",
            repeaterDevice: ls.get("repeaterDevice") || "",
            repeaterZip: ls.get("repeaterZip") || "",
          };
        },
        saveSel: function () {
          ls.set("senderDevice", $("#senderDeviceSelect").val() || "");
          ls.set("senderZip", $("#senderZipSelect").val() || "");
          ls.set("receiverDevice", $("#receiverDeviceSelect").val() || "");
          ls.set("receiverZip", $("#receiverZipSelect").val() || "");
          ls.set("repeaterDevice", $("#repeaterDeviceSelect").val() || "");
          ls.set("repeaterZip", $("#repeaterZipSelect").val() || "");
          ls.set("filterFrom", $("#filterFrom").val() || "");
          ls.set("filterTo", $("#filterTo").val() || "");
        },
      };

      var theadHtml =
        "<thead><tr>" +
        '<th scope="col" colspan="14" class="sorter-false filter-false">Sender</th>' +
        '<th scope="col" colspan="7" class="sorter-false filter-false rep-group">Repeater</th>' +
        '<th scope="col" colspan="8" class="sorter-false filter-false recv-group">Receiver</th>' +
        "</tr><tr>" +
        '<th scope="col" style="width:24px" class="sorter-false filter-false"></th>' +
        '<th scope="col" style="width:24px" class="sorter-false filter-false">&#9432;</th>' +
        '<th scope="col">MessageTypeName</th>' +
        '<th scope="col">InstanceName</th>' +
        '<th scope="col">MessageSubTypeName</th>' +
        '<th scope="col">SICardNumber</th>' +
        '<th scope="col">Punch time</th>' +
        '<th scope="col">SIStationNumber</th>' +
        '<th scope="col" class="sorter-shortDate" data-sorter="shortDate">SentDate</th>' +
        '<th scope="col">Ack/SendFailed</th>' +
        '<th scope="col">Time to Ack (s)</th>' +
        '<th scope="col">NoOfSendTries</th>' +
        '<th scope="col">SubscriberTypeName</th>' +
        '<th scope="col">TransformName</th>' +
        '<th scope="col" class="rep-group group-first">Repeater requested</th>' +
        '<th scope="col" class="rep-group filter-false">&#9432;</th>' +
        '<th scope="col" class="rep-group">Rep SentDate</th>' +
        '<th scope="col" class="rep-group">Rep Ack/SendFailed</th>' +
        '<th scope="col" class="rep-group">Rep NoOfSendTries</th>' +
        '<th scope="col" class="rep-group">Rep SubscriberTypeName</th>' +
        '<th scope="col" class="rep-group">Rep TransformName</th>' +
        '<th scope="col" class="recv-group group-first">Recv Repeater requested</th>' +
        '<th scope="col" class="recv-group filter-false">&#9432;</th>' +
        '<th scope="col" class="recv-group">Recv SentDate</th>' +
        '<th scope="col" class="recv-group">Recv Ack/SendFailed</th>' +
        '<th scope="col" class="recv-group">Recv NoOfSendTries</th>' +
        '<th scope="col" class="recv-group">Recv SubscriberTypeName</th>' +
        '<th scope="col" class="recv-group">Recv TransformName</th>' +
        '<th scope="col" class="recv-group" title="Punch time to SentDate in receiver">Total time</th>' +
        "</tr></thead>";

      function formatSportIdentTime(hour, minute, second) {
        if (hour == null && minute == null && second == null) return "";
        return (
          String(hour || "0").padStart(2, "0") +
          ":" +
          String(minute || "0").padStart(2, "0") +
          ":" +
          String(second || "0").padStart(2, "0")
        );
      }

      function loadDevices() {
        $.ajax({ url: "/api/v1/LogArchives/Devices", dataType: "json" }).then(
          function (data) {
            var devices = Array.isArray(data) ? data : data.devices || [];
            var senderSelect = $("#senderDeviceSelect");
            var receiverSelect = $("#receiverDeviceSelect");
            var repeaterSelect = $("#repeaterDeviceSelect");
            senderSelect.find("option:not(:first)").remove();
            receiverSelect.find("option:not(:first)").remove();
            repeaterSelect.find("option:not(:first)").remove();
            $.each(devices, function () {
              var name = this.name || this.BTAddress;
              var opt =
                '<option value="' +
                this.BTAddress +
                '">' +
                name +
                " (" +
                this.BTAddress +
                ")</option>";
              senderSelect.append(opt);
              receiverSelect.append(opt);
              repeaterSelect.append(opt);
            });

            // Restore saved selections
            var saved = ls.getSel();
            if (saved.senderDevice) {
              senderSelect.val(saved.senderDevice);
              loadZipFiles(
                saved.senderDevice,
                function (files) {
                  senderZipFiles = files;
                  if (saved.senderZip)
                    $("#senderZipSelect").val(saved.senderZip);
                  updateAnalyzeButton();
                  if (saved.senderZip) { loadLogFileList(saved.senderZip, "sender"); }
                },
                $("#senderZipSelect"),
              );
            }
            if (saved.receiverDevice) {
              receiverSelect.val(saved.receiverDevice);
              loadZipFiles(
                saved.receiverDevice,
                function (files) {
                  receiverZipFiles = files;
                  if (saved.receiverZip)
                    $("#receiverZipSelect").val(saved.receiverZip);
                  updateAnalyzeButton();
                  if (saved.receiverZip) { loadLogFileList(saved.receiverZip, "receiver"); }
                },
                $("#receiverZipSelect"),
              );
            }
            if (saved.repeaterDevice) {
              repeaterSelect.val(saved.repeaterDevice);
              loadZipFiles(
                saved.repeaterDevice,
                function (files) {
                  if (saved.repeaterZip)
                    $("#repeaterZipSelect").val(saved.repeaterZip);
                  updateAnalyzeButton();
                  if (saved.repeaterZip) { loadLogFileList(saved.repeaterZip, "repeater"); }
                },
                $("#repeaterZipSelect"),
              );
            }
            if (saved.filterFrom) {
              $("#filterFrom").val(saved.filterFrom);
              if (tdFrom && saved.filterFrom)
                tdFrom.dates.setFromInput(saved.filterFrom);
            }
            if (saved.filterTo) {
              $("#filterTo").val(saved.filterTo);
              if (tdTo && saved.filterTo)
                tdTo.dates.setFromInput(saved.filterTo);
            }
            // Restore MessageType checkboxes (SI/SRR default checked, others unchecked)
            $('#chkMT_SI').prop('checked', ls.get('chkMT_SI') !== '0');
            $('#chkMT_SRR').prop('checked', ls.get('chkMT_SRR') !== '0');
            $('#chkMT_LORA').prop('checked', ls.get('chkMT_LORA') === '1');
            $('#chkMT_REPEATER').prop('checked', ls.get('chkMT_REPEATER') === '1');
            // Restore STATUS checkbox (default unchecked)
            if (ls.get('showStatus') === '1') {
              $('#chkShowStatus').prop('checked', true);
            } else {
              $('#chkShowStatus').prop('checked', false);
            }
          },
        );
      }

      function loadZipFiles(btAddress, callback, targetSelect) {
        if (!btAddress) {
          targetSelect
            .empty()
            .append('<option value="">-- First select a device --</option>')
            .prop("disabled", true);
          callback([]);
          return;
        }
        targetSelect
          .empty()
          .append('<option value="">Loading...</option>')
          .prop("disabled", true);
        $.ajax({
          url:
            "/api/v1/LogArchives/Files?BTAddress=" +
            encodeURIComponent(btAddress),
          dataType: "json",
        })
          .then(function (files) {
            targetSelect.empty();
            if (files.length === 0) {
              targetSelect
                .append('<option value="">No zip files found</option>')
                .prop("disabled", true);
              callback([]);
              return;
            }
            targetSelect.append(
              '<option value="">-- Select a zip file --</option>',
            );
            $.each(files, function () {
              targetSelect.append(
                '<option value="' +
                  this.filename +
                  '">' +
                  this.filename.replace(".zip", "") +
                  "</option>",
              );
            });
            targetSelect.prop("disabled", false);
            callback(files);
          })
          .fail(function () {
            targetSelect
              .empty()
              .append('<option value="">Error loading files</option>')
              .prop("disabled", true);
            callback([]);
          });
      }

      function updateAnalyzeButton() {
        $("#btnAnalyze").prop("disabled", !$("#senderZipSelect").val());
      }

      // --- Log file loading ---
      function clearLogSide(side) {
        $('#' + side + 'LogFileSelect').empty().append('<option value="">-- Select a zip file --</option>');
        $('#' + side + 'LogTableContainer').empty();
      }

      function loadLogFileList(zipName, side) {
        $.ajax({
          url:
            "/api/v1/LogArchives/LogFiles?zip=" + encodeURIComponent(zipName),
          dataType: "json",
        })
          .then(function (files) {
            var $sel = $("#" + side + "LogFileSelect");
            $sel.empty();
            if (!files.length) {
              $sel.append('<option value="">No log files found</option>');
              return;
            }
            $.each(files, function () {
              var sizeLabel =
                this.size > 1024
                  ? Math.round(this.size / 1024) + " KB"
                  : this.size + " B";
              $sel.append(
                '<option value="' +
                  this.fullpath +
                  '">' +
                  this.filename +
                  " (" +
                  sizeLabel +
                  ")</option>",
              );
            });
          })
          .fail(function () {
            $("#" + side + "LogFileSelect")
              .empty()
              .append('<option value="">Error loading</option>');
          });
      }

      function buildLogTable(side, zipName, logFile) {
        $.ajax({
          url:
            "/api/v1/LogArchives/LogContent?zip=" +
            encodeURIComponent(zipName) +
            "&logfile=" +
            encodeURIComponent(logFile),
          dataType: "json",
        }).then(function (lines) {
          var $container = $("#" + side + "LogTableContainer");
          $container.empty();

          // Build table with date range filter row that gets datepickers attached
          var rangeRowId = side + 'LogRangeRow';
          var dateInputs = $(
            '<table class="filterLayout" style="width:230px"><tr>' +
            '<td style="font-size:11px;padding-right:4px">From:</td>' +
            '<td><div class="input-group input-group-sm" id="' + side + 'LogFromGrp" data-td-target-input="nearest" data-td-target-toggle="nearest">' +
            '<input id="' + side + 'LogFromIn" type="text" class="form-control log-date-input" style="width:80px;font-size:11px" placeholder="yyyy-MM-dd HH:mm" autocomplete="off">' +
            '<span class="input-group-text" style="cursor:pointer;padding:1px 4px" data-td-target="#' + side + 'LogFromGrp" data-td-toggle="datetimepicker"><i class="fa fa-calendar"></i></span>' +
            '</div></td>' +
            '</tr><tr>' +
            '<td style="font-size:11px;padding-right:4px">To:</td>' +
            '<td><div class="input-group input-group-sm" id="' + side + 'LogToGrp" data-td-target-input="nearest" data-td-target-toggle="nearest">' +
            '<input id="' + side + 'LogToIn" type="text" class="form-control log-date-input" style="width:80px;font-size:11px" placeholder="yyyy-MM-dd HH:mm" autocomplete="off">' +
            '<span class="input-group-text" style="cursor:pointer;padding:1px 4px" data-td-target="#' + side + 'LogToGrp" data-td-toggle="datetimepicker"><i class="fa fa-calendar"></i></span>' +
            '</div></td>' +
            '</tr></table>'
          );

          var $table = $('<table class="table table-sm table-hover" id="' + side + 'LogTable"></table>');
          var $thead = $(
            '<thead><tr>' +
              '<th scope="col" class="sorter-shortDate" data-sorter="shortDate">LogTime</th>' +
              '<th scope="col">Source</th>' +
              '<th scope="col">LogLevel</th>' +
              '<th scope="col">Message</th>' +
            '</tr></thead>'
          );
          var $tbody = $("<tbody></tbody>");
          $.each(lines, function () {
            $tbody.append(
              "<tr><td>" + (this.LogTime || "") + "</td>" +
              "<td>" + (this.Source || "") + "</td>" +
              "<td>" + (this.LogLevel || "") + "</td>" +
              "<td>" + (this.Message || "") + "</td></tr>"
            );
          });
          $table.append($thead).append($tbody);
          $container.append($table);

          // Tablesorter
          $table.tablesorter({ theme: "bootstrap", widgets: ["zebra"] });

          // TableFilter with custom date range filter on LogTime
          $table.tableFilter({
            columnFilters: [
              {
                columnName: "LogTime",
                inputType: "custom",
                control: dateInputs,
                matchFunction: function (ctrl, trf, textFilterValue) {
                  var from = $("#" + side + "LogFromIn").val() || '';
                  var to = $("#" + side + "LogToIn").val() || '';
                  if (!from && !to) return true;
                  var logTime = trf.LogTime || '';
                  if (!logTime) return true;
                  var rowDate = new Date(logTime.replace(' ', 'T').replace(/,/g, '.').substring(0, 19));
                  if (isNaN(rowDate.getTime())) return true;
                  var fromDate = from ? new Date(from.replace(' ', 'T')) : null;
                  var toDate = to ? new Date(to.replace(' ', 'T')) : null;
                  if (fromDate && !isNaN(fromDate.getTime()) && rowDate < fromDate) return false;
                  if (toDate && !isNaN(toDate.getTime()) && rowDate > toDate) return false;
                  return true;
                },
                setupTrigger: function (func) {
                  $("#" + side + "LogFromIn, #" + side + "LogToIn").on("change input", func);
                },
                getValue: function () {
                  return $("#" + side + "LogFromIn").val() + ";" + $("#" + side + "LogToIn").val();
                },
                setValue: function (v) {
                  if (v) {
                    var s = v.split(";");
                    $("#" + side + "LogFromIn").val(s[0] || "");
                    $("#" + side + "LogToIn").val(s[1] || "");
                  }
                }
              },
              { columnName: "Source", inputType: "text" },
              { columnName: "LogLevel", inputType: "text" },
              { columnName: "Message", inputType: "text" }
            ],
            enableCookies: false
          });

          // Init Tempus Dominus pickers
          var pickerOpts = {
            display: {
              sideBySide: true,
              components: {
                clock: true,
                useTwentyfourHour: true
              },
              icons: {
                time: 'fa fa-clock',
                date: 'fa fa-calendar',
                up: 'fa fa-arrow-up',
                down: 'fa fa-arrow-down',
                previous: 'fa fa-chevron-left',
                next: 'fa fa-chevron-right',
                today: 'fa fa-calendar-check',
                clear: 'fa fa-trash',
                close: 'fa fa-xmark'
              }
            },
            localization: { format: 'yyyy-MM-dd HH:mm' }
          };
          var tdFrom = new tempusDominus.TempusDominus(document.getElementById(side + 'LogFromGrp'), pickerOpts);
          var tdTo = new tempusDominus.TempusDominus(document.getElementById(side + 'LogToGrp'), pickerOpts);

          // Set defaults to first/last log times
          var logTimes = $.map(lines, function (l) { return l.LogTime; }).filter(Boolean).sort();
          if (logTimes.length > 0) {
            var first = logTimes[0].replace(' ', 'T').replace(/,/g, '.').substring(0, 16);
            var last = logTimes[logTimes.length - 1].replace(' ', 'T').replace(/,/g, '.').substring(0, 16);
            $('#' + side + 'LogFromIn').val(first);
            $('#' + side + 'LogToIn').val(last);
            setTimeout(function () {
              tdFrom.dates.setFromInput(first);
              tdTo.dates.setFromInput(last);
            }, 100);
          }

          // Also trigger on manual text input
          $("#" + side + "LogFromIn, #" + side + "LogToIn").on("input", function () {
            if (triggerFilter) triggerFilter();
          });
        });
      }

      function buildRowHtml(row, isChild, hasChildren, childSucceeded) {
        var sportIdent = formatSportIdentTime(
          row.SportIdentHour,
          row.SportIdentMinute,
          row.SportIdentSecond,
        );
        var sportIdent2 = formatSportIdentTime(
          row.SportIdentHour2,
          row.SportIdentMinute2,
          row.SportIdentSecond2,
        );

        // Per-cell inline style to kill Bootstrap's inset box-shadow and apply our own background
        var isDuplicate = (row._rowKind === 'duplicate');
        var cellBg = "";
        if (isChild) {
          cellBg = "box-shadow:none;background-color:#faf3d1";
        } else if (isDuplicate) {
          // Duplicates share their original's stripe: inherit the same bg
          // The stripeIdx was copied from the original so use the same logic
          cellBg = (row._stripeIdx !== undefined && row._stripeIdx % 2 === 1)
            ? "box-shadow:none;background-color:rgba(0,0,0,.05)"
            : "box-shadow:none";
        } else if (row._stripeIdx !== undefined && row._stripeIdx % 2 === 1) {
          cellBg = "box-shadow:none;background-color:rgba(0,0,0,.05)";
        } else {
          cellBg = "box-shadow:none";
        }

        // Muted italic for duplicate sender fields
        var senderCellBg = isDuplicate ? cellBg + ";color:#999;font-style:italic" : cellBg;

        // For child rows & duplicates, Ack/SendFailed cell keeps its status color, not the muted style
        var ackCellBg = (isChild || isDuplicate)
          ? "box-shadow:none" // let CSS classes .ack-cell/.sendfailed-cell handle the color
          : cellBg;

        var ackCell = "";
        if (row.AckReceivedDate) {
          ackCell =
            '<td style="' +
            ackCellBg +
            '" class="ack-cell">' +
            row.AckReceivedDate +
            "</td>";
        } else if (row.SendFailedDate) {
          var extra = "";
          if (!isChild && hasChildren) {
            extra = childSucceeded
              ? ' <span style="color:#198754;font-weight:bold;font-size:1.1em" title="Resubmit succeeded">&#10003;</span>'
              : ' <span style="color:#dc3545;font-weight:bold;font-size:1.1em" title="Resubmit also failed">&#10007;</span>';
          }
          ackCell =
            '<td style="' +
            ackCellBg +
            '" class="sendfailed-cell">' +
            row.SendFailedDate +
            extra +
            "</td>";
        } else {
          ackCell = '<td style="' + ackCellBg + '"></td>';
        }

        // Time to Ack (seconds) — computed from row or child data
        var timeToAck = "";
        var ackFinished =
          row._bestAckFinishedDate && row._bestAckFinishedDate !== "none"
            ? row._bestAckFinishedDate
            : row.AckReceivedDate;
        if (ackFinished && row.SentDate) {
          var ackDate = new Date(ackFinished.replace(" ", "T") + "Z");
          var sentDate = new Date(row.SentDate.replace(" ", "T") + "Z");
          if (!isNaN(ackDate.getTime()) && !isNaN(sentDate.getTime())) {
            timeToAck = Math.round(
              (ackDate.getTime() - sentDate.getTime()) / 1000,
            );
          }
        }

        // Total time: receiver SentDate minus punch time (seconds)
        var totalTime = "";
        if (
          hasReceiverData &&
          row.recv_SentDate &&
          row.SportIdentHour != null
        ) {
          var h = parseInt(row.SportIdentHour) || 0;
          var m = parseInt(row.SportIdentMinute) || 0;
          var s = parseInt(row.SportIdentSecond) || 0;
          var punchSeconds = h * 3600 + m * 60 + s;
          // Extract time portion from receiver SentDate (format: yyyy-MM-dd HH:mm:ss)
          var recvSent = row.recv_SentDate;
          var timeMatch = recvSent.match(/(\d{2}):(\d{2}):(\d{2})/);
          if (timeMatch) {
            var recvSeconds =
              (parseInt(timeMatch[1]) || 0) * 3600 +
              (parseInt(timeMatch[2]) || 0) * 60 +
              (parseInt(timeMatch[3]) || 0);
            totalTime = recvSeconds - punchSeconds;
          }
        }

        // Info tooltip helper
        function infoCell(bg, title) {
          if (!title) return '<td style="' + bg + '"></td>';
          return '<td style="' + bg + ';font-size:13px;cursor:help;text-align:center" title="' + title + '">&#9432;</td>';
        }
        function emptyTd(bg) { return '<td style="' + bg + '"></td>'; }
        function emptyTds(n, bg) { var s = ''; for (var i = 0; i < n; i++) s += emptyTd(bg); return s; }

        // Compute info tooltips for all groups
        var senderInfoTitle = '';
        if (row.orig_id) senderInfoTitle += 'orig_id: ' + row.orig_id;
        if (row.CreatedDate) senderInfoTitle += (senderInfoTitle ? '\n' : '') + 'CreatedDate: ' + row.CreatedDate;

        var repInfoTitle = '';
        if (row.rep_OrigId) repInfoTitle += 'orig_id: ' + row.rep_OrigId;
        if (row.rep_CreatedDate) repInfoTitle += (repInfoTitle ? '\n' : '') + 'CreatedDate: ' + row.rep_CreatedDate;

        var recvInfoTitle = '';
        if (row.recv_SentDate) recvInfoTitle += 'SentDate: ' + row.recv_SentDate;
        if (row.recv_OrigId) recvInfoTitle += (recvInfoTitle ? '\n' : '') + 'orig_id: ' + row.recv_OrigId;
        if (row.recv_CreatedDate) recvInfoTitle += (recvInfoTitle ? '\n' : '') + 'CreatedDate: ' + row.recv_CreatedDate;

        // Repeater columns (between sender and receiver)
        var REP_COLS = 7, RECV_COLS = 8;
        var repeaterCols = emptyTds(REP_COLS, cellBg);
        if (hasRepeaterData) {
          var repAckBg = isChild ? ackCellBg : cellBg;
          var repReqCell = '<td style="' + cellBg + '" class="group-first"></td>';
          // "Repeater requested" indicator from bit 5 of MessageData first byte
          if (row.rep_MessageData) {
            var firstByte = parseInt(row.rep_MessageData.substring(0, 2), 16);
            if (firstByte & 0x20) { // bit 5 set
              var repTransform = row.rep_TransformName || '';
              if (repTransform === 'RepeaterSIMessageToLoraAckTransform' || repTransform === 'RepeaterSIMessageDoubleToLoraAckTransform') {
                repReqCell = '<td style="' + cellBg + ';text-align:center" class="group-first" title=""></td>';
              } else {
                repReqCell = '<td style="' + cellBg + ';text-align:center" class="group-first" title="Repeater requested">&lt;—&gt;</td>';
              }
            }
          }
          var repAckCell = "";
          if (row.rep_AckReceivedDate) {
            repAckCell = '<td style="' + repAckBg + '" class="ack-cell">' + row.rep_AckReceivedDate + "</td>";
          } else if (row.rep_SendFailedDate) {
            repAckCell = '<td style="' + repAckBg + '" class="sendfailed-cell">' + row.rep_SendFailedDate + "</td>";
          } else {
            repAckCell = '<td style="' + repAckBg + '"></td>';
          }
          repeaterCols =
            repReqCell +
            infoCell(cellBg, repInfoTitle) +
            '<td style="' + cellBg + '">' + (row.rep_SentDate || "") + "</td>" +
            repAckCell +
            '<td style="' + cellBg + '">' + (row.rep_NoOfSendTries != null ? row.rep_NoOfSendTries : "") + "</td>" +
            '<td style="' + cellBg + '">' + (row.rep_SubscriberTypeName || "") + "</td>" +
            '<td style="' + cellBg + '">' + (row.rep_TransformName || "") + "</td>";
        }

        var receiverCols = emptyTds(RECV_COLS, cellBg);
        if (hasReceiverData) {
          var recvAckBg = isChild ? ackCellBg : cellBg;
          var recvAckCell = "";
          if (row.recv_AckReceivedDate) {
            recvAckCell =
              '<td style="' +
              recvAckBg +
              '" class="ack-cell">' +
              row.recv_AckReceivedDate +
              "</td>";
          } else if (row.recv_SendFailedDate) {
            recvAckCell =
              '<td style="' +
              recvAckBg +
              '" class="sendfailed-cell">' +
              row.recv_SendFailedDate +
              "</td>";
          } else {
            recvAckCell = '<td style="' + recvAckBg + '"></td>';
          }
          // Recv Repeater requested: same logic as sender's repeater but using recv_MessageData
          var recvReqCell = '<td style="' + cellBg + '" class="group-first"></td>';
          if (row.recv_MessageData) {
            var recvFirstByte = parseInt(row.recv_MessageData.substring(0, 2), 16);
            if (recvFirstByte & 0x20) {
              var recvTransform = row.recv_TransformName || '';
              if (recvTransform === 'RepeaterSIMessageToLoraAckTransform' || recvTransform === 'RepeaterSIMessageDoubleToLoraAckTransform') {
                recvReqCell = '<td style="' + cellBg + ';text-align:center" class="group-first" title="Receiver acked">&#10003;</td>';
              } else {
                recvReqCell = '<td style="' + cellBg + ';text-align:center" class="group-first" title="Repeater relayed">&lt;—&gt;</td>';
              }
            }
          }
          receiverCols =
            recvReqCell +
            infoCell(cellBg, recvInfoTitle) +
            '<td style="' +
            cellBg +
            '">' +
            (row.recv_SentDate || "") +
            "</td>" +
            recvAckCell +
            '<td style="' +
            cellBg +
            '">' +
            (row.recv_NoOfSendTries != null ? row.recv_NoOfSendTries : "") +
            "</td>" +
            '<td style="' +
            cellBg +
            '">' +
            (row.recv_SubscriberTypeName || "") +
            "</td>" +
            '<td style="' +
            cellBg +
            '">' +
            (row.recv_TransformName || "") +
            "</td>" +
            '<td style="' +
            cellBg +
            '">' +
            totalTime +
            "</td>";
        }

        var expandStyle = isChild
          ? cellBg
          : hasChildren
            ? "box-shadow:none;cursor:pointer;text-align:center"
            : "box-shadow:none";
        var expandCell = "";
        if (isChild) {
          expandCell = '<td style="' + cellBg + '"></td>';
        } else if (hasChildren) {
          expandCell =
            '<td class="subrow-toggle-cell" style="' +
            expandStyle +
            '"><span class="subrow-toggle closed">+</span></td>';
        } else if (isDuplicate) {
          expandCell = '<td class="dup-expand" style="' + cellBg + ';color:#aaa;font-size:11px;text-align:center" title="Additional receiver match — sender data is a copy">↳</td>';
        } else {
          expandCell = '<td style="' + cellBg + '"></td>';
        }

        var rowCls = isChild
          ? ' class="tablesorter-childRow subrow" style="display:none"'
          : ' class="parent-row' + (hasChildren ? " has-children" : "") + (isDuplicate ? " dup-row" : "") + '"';

        function senderTd(val) {
          return (
            '<td style="' + senderCellBg + '">' + (val == null ? "" : val) + "</td>"
          );
        }

        return (
          "<tr" +
          rowCls +
          ">" +
          expandCell +
          infoCell(senderCellBg, senderInfoTitle) +
          senderTd(row.MessageTypeName) +
          senderTd(row.InstanceName) +
          senderTd(row.MessageSubTypeName) +
          senderTd(row.SICardNumber) +
          senderTd(sportIdent) +
          senderTd(row.SIStationNumber) +
          senderTd(row.SentDate) +
          ackCell +
          senderTd(timeToAck) +
          senderTd(row.NoOfSendTries) +
          senderTd(row.SubscriberTypeName) +
          senderTd(row.TransformName) +
          repeaterCols +
          receiverCols +
          "</tr>"
        );
      }

      function buildTable(data, recvExtra, repExtra) {
        recvExtra = recvExtra || {};
        repExtra = repExtra || {};

        // Client-side row expansion for additional receiver matches
        if (hasReceiverData && Object.keys(recvExtra).length > 0) {
          var expanded = [];
          var extraUsed = {};
          $.each(data, function () {
            var key = (this.SICardNumber || '') + '|' +
              String(this.SportIdentHour || '0').padStart(2, '0') + '|' +
              String(this.SportIdentMinute || '0').padStart(2, '0') + '|' +
              String(this.SportIdentSecond || '0').padStart(2, '0') + '|' +
              (this.SIStationNumber || '');
            this._rowKind = 'original';
            expanded.push(this);
            if (this.MessageTypeName === 'STATUS' || this.InstanceName === 'resubmit1') return;
            if (extraUsed[key]) return;
            extraUsed[key] = true;
            var extras = recvExtra[key];
            if (extras) {
              for (var m = 0; m < extras.length; m++) {
                var dup = $.extend({}, this, extras[m], { _rowKind: 'duplicate' });
                expanded.push(dup);
              }
            }
          });
          data = expanded;
          console.log('After receiver expansion:', data.length, 'rows');
        }

        // Client-side row expansion for additional repeater matches
        if (hasRepeaterData && Object.keys(repExtra).length > 0) {
          var expanded2 = [];
          var extraUsed2 = {};
          $.each(data, function () {
            var key = (this.SICardNumber || '') + '|' +
              String(this.SportIdentHour || '0').padStart(2, '0') + '|' +
              String(this.SportIdentMinute || '0').padStart(2, '0') + '|' +
              String(this.SportIdentSecond || '0').padStart(2, '0') + '|' +
              (this.SIStationNumber || '');
            this._rowKind = 'original';
            expanded2.push(this);
            if (this.MessageTypeName === 'STATUS' || this.InstanceName === 'resubmit1') return;
            if (extraUsed2[key]) return;
            extraUsed2[key] = true;
            var extras = repExtra[key];
            if (extras) {
              // Sort repeater extras by TransformName: LoraTransform, DoubleToLoraTransform, LoraAckTransform, DoubleToLoraAckTransform
              var tnOrder = {
                'RepeaterSIMessageToLoraTransform': 0,
                'RepeaterSIMessageDoubleToLoraTransform': 1,
                'RepeaterSIMessageToLoraAckTransform': 2,
                'RepeaterSIMessageDoubleToLoraAckTransform': 3
              };
              extras.sort(function (a, b) {
                var oa = tnOrder[a.rep_TransformName] !== undefined ? tnOrder[a.rep_TransformName] : 999;
                var ob = tnOrder[b.rep_TransformName] !== undefined ? tnOrder[b.rep_TransformName] : 999;
                return oa - ob;
              });
              for (var m = 0; m < extras.length; m++) {
                var dup = $.extend({}, this, extras[m], { _rowKind: 'duplicate' });
                expanded2.push(dup);
              }
            }
          });
          data = expanded2;
          console.log('After repeater expansion:', data.length, 'rows');
        }

        var $container = $("#analyzeTableContainer");
        $container.empty();

        var $table = $(
          '<table class="table table-hover table-sm" id="analyzeResultsTable"></table>',
        );
        $table.append("<caption>Analyzed Messages</caption>");
        $table.append(theadHtml);
        var $tbody = $("<tbody></tbody>");

        // Build row-key helper
        function rowKey(row) {
          return (
            (row.SICardNumber || "") +
            "|" +
            formatSportIdentTime(
              row.SportIdentHour,
              row.SportIdentMinute,
              row.SportIdentSecond,
            ) +
            "|" +
            (row.SIStationNumber || "")
          );
        }

        // Pass 1: find children by key and mark parent rows
        var childrenByKey = {}; // key -> [child rows]
        var parentRowsByKey = {};
        var childKeys = {}; // which keys are children (to skip them in output)

        $.each(data, function () {
          if (this.SubscriberTypeName === "LORA" && this.SendFailedDate) {
            var key = rowKey(this);
            if (!parentRowsByKey[key]) {
              parentRowsByKey[key] = this;
            }
          }
        });

        $.each(data, function () {
          if (this.InstanceName === "resubmit1") {
            var key = rowKey(this);
            if (parentRowsByKey[key]) {
              if (!childrenByKey[key]) childrenByKey[key] = [];
              childrenByKey[key].push(this);
              childKeys[key] = true;
              return;
            }
          }
        });

        // --- Compute summary stats per MessageTypeName ---
        var summaryStats = {}; // key: MessageTypeName -> { total, ackedIncl, ackedExcl, tryCounts: [0,0,0,0,0,0] }
        function ensureStats(mt) {
          if (!summaryStats[mt])
            summaryStats[mt] = {
              total: 0,
              ackedIncl: 0,
              ackedExcl: 0,
              tryCounts: [0, 0, 0, 0, 0, 0],
            };
        }
        // Summary stats: iterate data in original order, skip children and duplicates
        $.each(data, function () {
          if (this.InstanceName === 'resubmit1') return; // skip children
          if (this._rowKind === 'duplicate') return; // skip duplicate receiver rows
          var mt = this.MessageTypeName || "(empty)";
          ensureStats(mt);
          var st = summaryStats[mt];
          st.total++;
          var key = rowKey(this);
          var childAcked = childrenByKey[key] && childrenByKey[key].some(function (c) { return !!c.AckReceivedDate; });
          if (this.AckReceivedDate) {
            st.ackedIncl++;
            st.ackedExcl++;
            var tries = parseInt(this.NoOfSendTries) || 0;
            if (tries >= 1 && tries <= 5) st.tryCounts[tries - 1]++;
          } else if (childAcked) {
            st.ackedIncl++;
          }
        });

        // --- Build summary sections per MessageTypeName ---
        // LORA and STATUS get their own cards, but excluded from grand totals
        var $summaryContainer = $("#summaryContainer").empty();
        var mtNames = Object.keys(summaryStats).sort();
        var grandTotal = 0,
          grandIncl = 0,
          grandExcl = 0,
          grandTries = [0, 0, 0, 0, 0];
        var cardCount = 0;
        var excludedCards = []; // STATUS cards go here

        function buildSummaryCard(name, st, dark) {
          var pct = function (n) {
            return st.total > 0
              ? ((n / st.total) * 100).toFixed(1) + "% (" + n + ")"
              : "-";
          };
          var full = function (n) {
            if (st.total === 0) return "-";
            var perc = ((n / st.total) * 100).toFixed(1);
            return perc + "% (" + n + ")";
          };
          var maybeGreen = function (n) {
            if (st.total > 0 && n === st.total)
              return ' style="background-color:#d4edda"';
            return "";
          };
          var headerClass = dark ? "bg-dark text-white" : "";
          var borderStyle = dark
            ? "border-width:2px;border-color:#333;break-inside:avoid"
            : "break-inside:avoid";
          var $card = $(
            '<div class="card mb-2" style="' +
              borderStyle +
              '"><div class="card-header py-1 ' +
              headerClass +
              '"><strong>' +
              name +
              "</strong> (" +
              st.total +
              " total)</div></div>",
          );
          var $list = $('<ul class="list-group list-group-flush"></ul>');
          $list.append(
            '<li class="list-group-item py-1"' +
              maybeGreen(st.ackedIncl) +
              '><span class="text-muted">% Acked (incl. resubmit):</span> <strong>' +
              full(st.ackedIncl) +
              "</strong></li>",
          );
          $list.append(
            '<li class="list-group-item py-1"' +
              maybeGreen(st.ackedExcl) +
              '><span class="text-muted">% Acked (excl. resubmit):</span> <strong>' +
              full(st.ackedExcl) +
              "</strong></li>",
          );
          var indent = "ps-5";
          $list.append(
            '<li class="list-group-item py-1 ' +
              indent +
              '"' +
              maybeGreen(st.tryCounts[0]) +
              '><span class="text-muted">&#8627; % Acked on 1st try:</span> <strong>' +
              full(st.tryCounts[0]) +
              "</strong></li>",
          );
          $list.append(
            '<li class="list-group-item py-1 ' +
              indent +
              '"' +
              maybeGreen(st.tryCounts[1]) +
              '><span class="text-muted">&#8627; % Acked on 2nd try:</span> <strong>' +
              full(st.tryCounts[1]) +
              "</strong></li>",
          );
          $list.append(
            '<li class="list-group-item py-1 ' +
              indent +
              '"' +
              maybeGreen(st.tryCounts[2]) +
              '><span class="text-muted">&#8627; % Acked on 3rd try:</span> <strong>' +
              full(st.tryCounts[2]) +
              "</strong></li>",
          );
          $list.append(
            '<li class="list-group-item py-1 ' +
              indent +
              '"' +
              maybeGreen(st.tryCounts[3]) +
              '><span class="text-muted">&#8627; % Acked on 4th try:</span> <strong>' +
              full(st.tryCounts[3]) +
              "</strong></li>",
          );
          $list.append(
            '<li class="list-group-item py-1 ' +
              indent +
              '"' +
              maybeGreen(st.tryCounts[4]) +
              '><span class="text-muted">&#8627; % Acked on 5th try:</span> <strong>' +
              full(st.tryCounts[4]) +
              "</strong></li>",
          );
          $card.append($list);
          return $card;
        }

        $.each(mtNames, function () {
          var name = this;
          var st = summaryStats[name];
          // LORA: skip entirely
          if (name == "LORA") {
            return;
          }
          // STATUS: show card now but exclude from grand totals
          if (name == "STATUS") {
            excludedCards.push({ name: name, st: st, isStatus: true });
            return;
          }
          grandTotal += st.total;
          grandIncl += st.ackedIncl;
          grandExcl += st.ackedExcl;
          for (var t = 0; t < 5; t++) grandTries[t] += st.tryCounts[t];
          cardCount++;
          $summaryContainer.append(buildSummaryCard(name, st, false));
        });

        // Grand total card (excl. LORA and STATUS)
        if (cardCount > 0) {
          var full = function (n) {
            if (grandTotal === 0) return "-";
            return ((n / grandTotal) * 100).toFixed(1) + "% (" + n + ")";
          };
          var maybeGreen = function (n) {
            if (grandTotal > 0 && n === grandTotal)
              return ' style="background-color:#d4edda"';
            return "";
          };
          var includedTypes = mtNames
            .filter(function (n) {
              return n != "LORA" && n != "STATUS";

            .join(", ");
          var $allCard = $(
            '<div class="card mb-2" style="break-inside:avoid;border:2px solid #333"><div class="card-header py-1 bg-dark text-white"><strong>ALL</strong> (' +
              grandTotal +
              ' total) <small style="font-weight:normal">from: ' +
              includedTypes +
              "</small></div></div>",
          );
          var $allList = $('<ul class="list-group list-group-flush"></ul>');
          $allList.append(
            '<li class="list-group-item py-1"' +
              maybeGreen(grandIncl) +
              "><span>% Acked (incl. resubmit):</span> <strong>" +
              full(grandIncl) +
              "</strong></li>",
          );
          $allList.append(

              maybeGreen(grandExcl) +
              "><span>% Acked (excl. resubmit):</span> <strong>" +

            '<li class="list-group-item py-1 ' +

              '"' +
              maybeGreen(grandTries[0]) +
              '><span class="text-muted">&#8627; % Acked on 1st try:</span> <strong>' +

              maybeGreen(grandTries[1]) +
              '><span class="text-muted">&#8627; % Acked on 2nd try:</span> <strong>' +
              full(grandTries[1]) +
              "</strong></li>",

          $allList.append(

              '"' +
              maybeGreen(grandTries[2]) +
              '><span class="text-muted">&#8627; % Acked on 3rd try:</span> <strong>' +

              maybeGreen(grandTries[3]) +

        // Append excluded cards (STATUS) after grand total, with muted styling
        $.each(excludedCards, function () {

            if (st.total === 0) return "-";

          $list.append(

          $card.append($list);
          $summaryContainer.append($card);
        });

        // Layout cards in columns if many
        if (cardCount >= 2)
          $summaryContainer.css({ columns: "2", columnGap: "1rem" });
        $("#summarySection").show();

        // Output rows in original order: parents with children, standalone as-is, children skipped
        var parentIdx = 0;
        var renderedParents = {}; // tracks which parent keys have already been rendered
        $.each(data, function () {
          var key = rowKey(this);
          // Is this a child row? Skip (already rendered under its parent)
          if (this.InstanceName === 'resubmit1' && parentRowsByKey[key]) return;

          // Is this a parent row that hasn't been rendered yet?
          var isParent = (parentRowsByKey[key] === this && this.SubscriberTypeName === "LORA" && this.SendFailedDate);
          if (isParent) {
            renderedParents[key] = true;
            var hasKids = !!(childrenByKey[key] && childrenByKey[key].length > 0);
            var anyChildSucceeded = false;
            var bestChildAckDate = null;
            if (hasKids) {
              anyChildSucceeded = childrenByKey[key].some(function (c) { return !!c.AckReceivedDate; });
              childrenByKey[key].forEach(function (c) {
                if (c.AckReceivedDate && !bestChildAckDate) bestChildAckDate = c.AckReceivedDate;
              });
            }
            this._bestAckFinishedDate = bestChildAckDate || "none";
            this._stripeIdx = parentIdx++;
            $tbody.append(buildRowHtml(this, false, hasKids, anyChildSucceeded));
            if (hasKids) {
              $.each(childrenByKey[key], function () {
                $tbody.append(buildRowHtml(this, true, false, false));
              });
            }
          } else {
            // Standalone row (or duplicate parent already rendered)
            this._stripeIdx = parentIdx++;
            $tbody.append(buildRowHtml(this, false, false, false));
          }
        });

        $table.append($tbody);
        $container.append($table);

        // Toggle subrows on click (delegated, survives sort/filter DOM rewrites)
        $table.on("click", ".subrow-toggle-cell", function (e) {
          e.stopPropagation();
          var $cell = $(this);
          var $btn = $cell.find(".subrow-toggle");
          var $parent = $cell.closest("tr");
          if ($btn.hasClass("open")) {
            // Collapse
            $btn.removeClass("open").addClass("closed").text("+");
            $parent.nextUntil(":not(.subrow)").hide();
          } else {
            // Expand
            $btn.removeClass("closed").addClass("open").text("−");
            $parent.nextUntil(":not(.subrow)").show();
          }
        });

        function syncSubrowVisibility() {
          $table.find("tr.parent-row.has-children").each(function () {
            var $parent = $(this);
            var $btn = $parent.find(".subrow-toggle");
            var $children = $parent.nextUntil(":not(.subrow)");
            if ($btn.hasClass("open")) {
              $children.show();
              $btn.text("−");
            } else {
              $children.hide();
              $btn.text("+");
            }
          });
        }

        function restripeParents() {
          $table.find("tr.subrow").each(function () {
            var $sub = $(this);
            var $prev = $sub.prev();
            if (!$prev.hasClass("parent-row") || $prev.is(":hidden"))
              $sub.hide();
          });
          var i = 0;
          $table.find("tbody tr.parent-row").each(function () {
            var $row = $(this);
            var isDup = $row.hasClass("dup-row");
            if ($row.is(":visible")) {
              var bg = "box-shadow:none";
              if (isDup) {
                // Match the previous non-dup parent row's background
                var $prev = $row.prevAll(".parent-row:not(.dup-row)").first();
                if ($prev.length) {
                  bg = $prev.find("td").first().attr("style") || bg;
                  if (bg.indexOf("rgba") === -1) bg = "box-shadow:none";
                }
              } else if (i % 2 === 1) {
                bg += ";background-color:rgba(0,0,0,.05)";
              }
              $row.find("td").attr("style", bg);
              // Re-apply muted color/italic for duplicate sender cells (expand col + sender cols)
              if (isDup) {
                $row.find("td").slice(0, 14).css({color: '#999', fontStyle: 'italic'});
                $row.find("td").eq(0).css({color: '#aaa', fontSize: '11px', textAlign: 'center'});
              }
              if (!isDup) i++;
            }
          });
        }

      $(function () {
        // Init dual scrollbars (top + bottom) for wide tables
        var $topBar = $("#topScrollBar");
        var $wrapper = $("#tableScrollWrapper");
        $topBar.on("scroll", function () {
          $wrapper.scrollLeft($topBar.scrollLeft());
        });
        $wrapper.on("scroll", function () {
          $topBar.scrollLeft($wrapper.scrollLeft());
        });
        var $phantom = $topBar.find("div");
        var observer = new ResizeObserver(function () {
          var w = $wrapper[0].scrollWidth;
          $phantom.width(w);
          $topBar.toggle(w > $wrapper.width());
        });
        observer.observe($wrapper[0]);

        $("#nav-placeholder").load("navigation.html", function () {
          initNavigation();
          getIsLoggedIn(function (isLoggedIn) {
            if (isLoggedIn) {
              $("#analyzerSection").show();
              loadDevices();
            } else {
              $("#loginRequiredAlert").removeClass("collapse");
            }
          });
        });

        $("#senderDeviceSelect").on("change", function () {
          ls.set("senderDevice", $(this).val() || "");
          loadZipFiles(
            $(this).val(),
            function (files) {
              senderZipFiles = files;
              updateAnalyzeButton();
            },
            $("#senderZipSelect"),
          );
        });

        $("#receiverDeviceSelect").on("change", function () {
          ls.set("receiverDevice", $(this).val() || "");
          loadZipFiles(
            $(this).val(),
            function (files) {
              receiverZipFiles = files;
              updateAnalyzeButton();
            },
            $("#receiverZipSelect"),
          );
        });

        $("#repeaterDeviceSelect").on("change", function () {
          ls.set("repeaterDevice", $(this).val() || "");
          loadZipFiles(
            $(this).val(),
            function (files) {
              updateAnalyzeButton();
            },
            $("#repeaterZipSelect"),
          );
        });

        $("#senderZipSelect, #receiverZipSelect, #repeaterZipSelect").on("change", function () {
          ls.set("senderZip", $("#senderZipSelect").val() || "");
          ls.set("receiverZip", $("#receiverZipSelect").val() || "");
          ls.set("repeaterZip", $("#repeaterZipSelect").val() || "");
          updateAnalyzeButton();
          var sz = $("#senderZipSelect").val();
          var rz = $("#receiverZipSelect").val();
          var pz = $("#repeaterZipSelect").val();
          if (sz) { loadLogFileList(sz, "sender"); }
          else { clearLogSide("sender"); }
          if (rz) { loadLogFileList(rz, "receiver"); }
          else { clearLogSide("receiver"); }
          if (pz) { loadLogFileList(pz, "repeater"); }

        // Initialize Tempus Dominus date/time pickers

        tdTo = new tempusDominus.TempusDominus(

          ls.set("filterFrom", $("#filterFrom").val() || "");
          ls.set("filterTo", $("#filterTo").val() || "");
        });

        // Show STATUS checkbox
        // Save MessageType checkboxes to localStorage
        $('#chkMT_SI, #chkMT_SRR, #chkMT_LORA, #chkMT_REPEATER, #chkShowStatus').on('change', function () {
          ls.set('chkMT_SI', $('#chkMT_SI').prop('checked') ? '1' : '0');
          ls.set('chkMT_SRR', $('#chkMT_SRR').prop('checked') ? '1' : '0');
          ls.set('chkMT_LORA', $('#chkMT_LORA').prop('checked') ? '1' : '0');
          ls.set('chkMT_REPEATER', $('#chkMT_REPEATER').prop('checked') ? '1' : '0');
          ls.set('showStatus', $('#chkShowStatus').prop('checked') ? '1' : '0');
        });

        // Log viewer: Load/Clear logs button handlers
        $("#btnLoadSenderLogs").on("click", function () {
          var logFile = $("#senderLogFileSelect").val();
          if (logFile)
            buildLogTable("sender", $("#senderZipSelect").val(), logFile);

        $("#btnClearSenderLogs").on("click", function () {
          $("#senderLogTableContainer").empty();

        $("#btnLoadReceiverLogs").on("click", function () {
          var logFile = $("#receiverLogFileSelect").val();
          if (logFile)
            buildLogTable("receiver", $("#receiverZipSelect").val(), logFile);
        });
        $("#btnClearReceiverLogs").on("click", function () {

        });
        $("#btnLoadRepeaterLogs").on("click", function () {
          var logFile = $("#repeaterLogFileSelect").val();
          if (logFile)
            buildLogTable("repeater", $("#repeaterZipSelect").val(), logFile);

        $("#btnClearRepeaterLogs").on("click", function () {

        $("#btnAnalyze").on("click", function () {
          var senderZip = $("#senderZipSelect").val();
          var receiverZip = $("#receiverZipSelect").val();
          if (!senderZip) return;

          $("#analyzeError").addClass("collapse");
          $("#btnAnalyzeSpinner").show();
          $("#btnAnalyze").prop("disabled", true);
          $("#analyzeLoading").show();
          $("#resultsSection").hide();

          var repeaterZip = $("#repeaterZipSelect").val();
          var url =
            "/api/v1/LogArchives/Analyze?senderZip=" +
            encodeURIComponent(senderZip);
          if (receiverZip)
            url += "&receiverZip=" + encodeURIComponent(receiverZip);
          if (repeaterZip)
            url += "&repeaterZip=" + encodeURIComponent(repeaterZip);
          var fromDate = $("#filterFrom").val();
          var toDate = $("#filterTo").val();
          if (fromDate) url += "&fromDate=" + encodeURIComponent(fromDate);
          if (toDate) url += "&toDate=" + encodeURIComponent(toDate);
          // Collect checked MessageTypeNames
          var msgTypes = [];
          $.each(['SI','SRR','LORA','REPEATER'], function (_, mt) {
            if ($('#chkMT_' + mt).prop('checked')) msgTypes.push(mt);
          });
          if (msgTypes.length > 0) url += "&msgTypes=" + encodeURIComponent(msgTypes.join(','));
          url += "&showStatus=" + ($('#chkShowStatus').prop('checked') ? '1' : '0');

          $.ajax({ url: url, dataType: "json", timeout: 60000 })
            .then(function (data) {
              $("#btnAnalyzeSpinner").hide();
              $("#btnAnalyze").prop("disabled", false);
              $("#analyzeLoading").hide();

              if (data.code) {
                $("#analyzeError")
                  .text(data.message || "Unknown error")
                  .removeClass("collapse");
                return;
              }

              var messages = Array.isArray(data) ? data : data.messages || [];
              var recvExtra = (data && data.recvExtra) || {};
              var repExtra = (data && data.repExtra) || {};
              console.log("Messages returned:", messages.length);

              hasReceiverData = !!receiverZip;
              hasRepeaterData = !!$("#repeaterZipSelect").val();
              $(".recv-group").toggle(hasReceiverData);
              $(".rep-group").toggle(hasRepeaterData);

              buildTable(messages, recvExtra, repExtra);
            })
            .fail(function (jqXHR) {
              $("#btnAnalyzeSpinner").hide();
              $("#btnAnalyze").prop("disabled", false);
              $("#analyzeLoading").hide();
              var msg = "Analysis failed";
              try {
                var resp = JSON.parse(jqXHR.responseText);
                if (resp.message) msg = resp.message;
                if (resp.debug && resp.debug.mergeError) msg = resp.debug.mergeError;
              } catch (e) {}
              console.error("Analyze failed:", jqXHR.status, jqXHR.responseText);
              $("#analyzeError").text(msg).removeClass("collapse");
            });
        });
      });
